# YOLO26s-P2 Object Detection Model with P2-P5 Heads (Strides 4, 8, 16, 32)
# Designed for ultra-dense micro-component inspection (0402 / 0201 SMD capacitors)

nc: 4
scales:
  s: [0.50, 0.50, 1024]

# YOLO Backbone with P2 feature tap (layer 2)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 2, C3k2, [128, False, 0.25]] # 2 (Backbone P2 tap)
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 2, C3k2, [256, False, 0.25]] # 4 (Backbone P3 tap)
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 2, C3k2, [512, True]]      # 6 (Backbone P4 tap)
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]        # 9 (Backbone P5 tap)

# High-Resolution P2 Feature Pyramid Network (PANet)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10 (P5 -> P4)
  - [[-1, 6], 1, Concat, [1]]                  # 11 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13 (P4 -> P3)
  - [[-1, 4], 1, Concat, [1]]                  # 14 cat backbone P3
  - [-1, 2, C3k2, [256, False]]                # 15 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16 (P3 -> P2)
  - [[-1, 2], 1, Concat, [1]]                  # 17 cat backbone P2 (stride 4)
  - [-1, 2, C3k2, [128, False]]                # 18 (P2/4-micro, 320x320 grid @ 1280px)

  - [-1, 1, Conv, [128, 3, 2]]                 # 19 (P2 -> P3)
  - [[-1, 15], 1, Concat, [1]]                 # 20 cat head P3
  - [-1, 2, C3k2, [256, False]]                # 21 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                 # 22 (P3 -> P4)
  - [[-1, 12], 1, Concat, [1]]                 # 23 cat head P4
  - [-1, 2, C3k2, [512, False]]                # 24 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                 # 25 (P4 -> P5)
  - [[-1, 9], 1, Concat, [1]]                  # 26 cat head P5
  - [-1, 2, C3k2, [1024, True]]                # 27 (P5/32-large)

  - [[18, 21, 24, 27], 1, Detect, [nc]]        # 28 Detect(P2, P3, P4, P5)
